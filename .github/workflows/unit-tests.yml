name: Unit tests

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '*.cff'
      - '*.yml'
      - '*.yaml'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '*.cff'
      - '*.yml'
      - '*.yaml'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.toolchain }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each platform is tested in Debug (asserts enabled) and in Release (-O3 -DNDEBUG, the
        # configuration users ship). Release catches side effects inside assert() and bugs that
        # only appear with optimization (uninitialized reads, aliasing, FP reassociation).
        include:

          # ---------- LINUX ----------
          - os: ubuntu-latest
            toolchain: gcc
            build_type: Debug
            shell: bash

          - os: ubuntu-latest
            toolchain: gcc
            build_type: Release
            shell: bash

          - os: ubuntu-24.04-arm
            toolchain: gcc
            build_type: Debug
            shell: bash

          - os: ubuntu-24.04-arm
            toolchain: gcc
            build_type: Release
            shell: bash

          # ---------- LINUX (Clang) ----------
          # Pinned to ubuntu-24.04 so that the clang-18, libomp-18 and libc++-18 packages exist.
          - os: ubuntu-24.04
            toolchain: clang
            build_type: Debug
            shell: bash

          - os: ubuntu-24.04
            toolchain: clang
            build_type: Release
            shell: bash

          # Clang + libc++. HiGHS is disabled: the prebuilt libhighs.a is compiled against libstdc++
          # and Uno calls its C++ API (std::vector members), which cannot cross into a libc++ build.
          - os: ubuntu-24.04
            toolchain: clang-libcxx
            build_type: Debug
            shell: bash

          # ---------- MACOS ----------
          - os: macos-15
            toolchain: gcc
            build_type: Debug
            shell: bash

          - os: macos-15
            toolchain: gcc
            build_type: Release
            shell: bash

          - os: macos-15-intel
            toolchain: gcc
            build_type: Debug
            shell: bash

          - os: macos-15-intel
            toolchain: gcc
            build_type: Release
            shell: bash

          # ---------- WINDOWS MINGW ----------
          - os: windows-latest
            toolchain: mingw
            build_type: Debug
            shell: msys2 {0}

          - os: windows-latest
            toolchain: mingw
            build_type: Release
            shell: msys2 {0}

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      # Debug only: enable libstdc++'s cheap precondition checks (bounds checks on std::vector::operator[],
      # front()/back() on empty containers, etc.). Unlike _GLIBCXX_DEBUG, this does not change the ABI.
      # libstdc++-specific: it has no effect with libc++ (macOS, Linux clang-libcxx), so it is only passed
      # on Linux and MinGW; the clang-libcxx row uses libc++'s debug hardening mode instead.
      UNO_CXX_FLAGS: ${{ matrix.build_type == 'Debug' && '-D_GLIBCXX_ASSERTIONS' || '' }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      # =========================================================
      # TOOLCHAIN SETUP
      # =========================================================

      # ----- macOS -----
      - name: Install libomp (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install libomp
          LIBGFORTRAN_FOLDER=$(dirname "$(gfortran-15 -print-file-name=libgfortran.dylib)")
          echo "LIBGFORTRAN_FOLDER=$LIBGFORTRAN_FOLDER" >> $GITHUB_ENV
          echo "OPENMP_LIB=$(brew --prefix libomp)/lib/libomp.dylib" >> $GITHUB_ENV

      # ----- Linux Clang -----
      - name: Install Clang toolchain (Linux)
        if: startsWith(matrix.toolchain, 'clang')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libomp-18-dev
          if [ "${{ matrix.toolchain }}" = "clang-libcxx" ]; then
            sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          fi

      # ----- MinGW -----
      - name: Setup MSYS2
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-libgomp
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-metis

      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Download dependencies
        run: bash dependencies/scripts/download_dependencies.sh

      # =========================================================
      # CONFIGURE
      # =========================================================

      - name: Configure (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          CC=gcc
          CXX=g++
          CXX_FLAGS="${UNO_CXX_FLAGS}"
          EXTRA_ARGS=()
          case "${{ matrix.toolchain }}" in
            clang)
              CC=clang-18
              CXX=clang++-18
              ;;
            clang-libcxx)
              CC=clang-18
              CXX=clang++-18
              CXX_FLAGS="-stdlib=libc++"
              if [ "${BUILD_TYPE}" = "Debug" ]; then
                CXX_FLAGS="${CXX_FLAGS} -D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_DEBUG"
              fi
              # libspral.a uses libstdc++ internally (behind its C API), so link libstdc++ explicitly.
              # -l:libstdc++.so.6 rather than -lstdc++: under -stdlib=libc++, the clang driver
              # rewrites -lstdc++ into -lc++.
              EXTRA_ARGS+=("-DAUXILIARY_LIBRARIES=-l:libstdc++.so.6")
              ;;
          esac
          if [ "${{ matrix.toolchain }}" != "clang-libcxx" ]; then
            EXTRA_ARGS+=(
              "-DHIGHS_INCLUDE_DIR=${{github.workspace}}/dependencies/include/highs"
              "-DHIGHS=${{github.workspace}}/dependencies/lib/libhighs.a;${{github.workspace}}/dependencies/lib/libhighs_extras.a"
            )
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DENABLE_TESTS=ON \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_CXX_COMPILER=${CXX} \
            -DCMAKE_CXX_FLAGS="${CXX_FLAGS}" \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DMUMPS_INCLUDE_DIR=${{github.workspace}}/dependencies/include \
            -DMETIS_INCLUDE_DIR=${{github.workspace}}/dependencies/include \
            -DSPRAL_INCLUDE_DIR=${{github.workspace}}/dependencies/include \
            -DBQPD=${{github.workspace}}/dependencies/lib/libbqpd.a \
            -DMETIS_LIBRARY=${{github.workspace}}/dependencies/lib/libmetis.a \
            -DMUMPS_LIBRARY=${{github.workspace}}/dependencies/lib/libdmumps.a \
            -DMUMPS_COMMON_LIBRARY=${{github.workspace}}/dependencies/lib/libmumps_common.a \
            -DMUMPS_PORD_LIBRARY=${{github.workspace}}/dependencies/lib/libpord.a \
            -DMUMPS_MPISEQ_LIBRARY=${{github.workspace}}/dependencies/lib/libmpiseq.a \
            -DSPRAL=${{github.workspace}}/dependencies/lib/libspral.a \
            -DBLAS_LIBRARIES="${{github.workspace}}/dependencies/lib/libcblas.a;${{github.workspace}}/dependencies/lib/libblas.a" \
            -DLAPACK_LIBRARIES=${{github.workspace}}/dependencies/lib/liblapack.a \
            -DBUILD_STATIC_LIBS=OFF \
            -DBUILD_SHARED_LIBS=ON \
            "${EXTRA_ARGS[@]}"

      - name: Configure (Mac)
        if: startsWith(matrix.os, 'macos')
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DENABLE_TESTS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=gfortran-15 \
            -DCMAKE_EXE_LINKER_FLAGS="-L${{env.LIBGFORTRAN_FOLDER}}" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L${{env.LIBGFORTRAN_FOLDER}}" \
            -DOpenMP_C_FLAGS="-Xpreprocessor -fopenmp" \
            -DOpenMP_C_LIB_NAMES="omp" \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY=${{ env.OPENMP_LIB }} \
            -DMUMPS_INCLUDE_DIR=${{github.workspace}}/dependencies/include \
            -DMETIS_INCLUDE_DIR=${{github.workspace}}/dependencies/include \
            -DHIGHS_INCLUDE_DIR=${{github.workspace}}/dependencies/include/highs \
            -DSPRAL_INCLUDE_DIR=${{github.workspace}}/dependencies/include \
            -DBQPD=${{github.workspace}}/dependencies/lib/libbqpd.a \
            -DMETIS_LIBRARY=${{github.workspace}}/dependencies/lib/libmetis.a \
            -DMUMPS_LIBRARY=${{github.workspace}}/dependencies/lib/libdmumps.a \
            -DMUMPS_COMMON_LIBRARY=${{github.workspace}}/dependencies/lib/libmumps_common.a \
            -DMUMPS_PORD_LIBRARY=${{github.workspace}}/dependencies/lib/libpord.a \
            -DMUMPS_MPISEQ_LIBRARY=${{github.workspace}}/dependencies/lib/libmpiseq.a \
            -DSPRAL=${{github.workspace}}/dependencies/lib/libspral.a \
            -DBLAS_LIBRARIES="${{github.workspace}}/dependencies/lib/libcblas.a;${{github.workspace}}/dependencies/lib/libblas.a" \
            -DLAPACK_LIBRARIES=${{github.workspace}}/dependencies/lib/liblapack.a \
            -DHIGHS="${{github.workspace}}/dependencies/lib/libhighs.a;${{github.workspace}}/dependencies/lib/libhighs_extras.a" \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_SHARED_LIBS=OFF

      - name: Configure (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -G "MinGW Makefiles" \
            -B build \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DENABLE_TESTS=ON \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS="${UNO_CXX_FLAGS}" \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DMUMPS_INCLUDE_DIR=${GITHUB_WORKSPACE}/dependencies/include \
            -DMETIS_INCLUDE_DIR=/mingw64/include \
            -DHIGHS_INCLUDE_DIR=${GITHUB_WORKSPACE}/dependencies/include/highs \
            -DSPRAL_INCLUDE_DIR=${GITHUB_WORKSPACE}/dependencies/include \
            -DBQPD=${GITHUB_WORKSPACE}/dependencies/lib/libbqpd.a \
            -DMETIS_LIBRARY=${GITHUB_WORKSPACE}/dependencies/lib/libmetis.a \
            -DMUMPS_LIBRARY=${GITHUB_WORKSPACE}/dependencies/lib/libdmumps.a \
            -DMUMPS_COMMON_LIBRARY=${GITHUB_WORKSPACE}/dependencies/lib/libmumps_common.a \
            -DMUMPS_PORD_LIBRARY=${GITHUB_WORKSPACE}/dependencies/lib/libpord.a \
            -DMUMPS_MPISEQ_LIBRARY=${GITHUB_WORKSPACE}/dependencies/lib/libmpiseq.a \
            -DSPRAL=${GITHUB_WORKSPACE}/dependencies/lib/libspral.a \
            -DBLAS_LIBRARIES="${GITHUB_WORKSPACE}/dependencies/lib/libcblas.a;${GITHUB_WORKSPACE}/dependencies/lib/libblas.a" \
            -DLAPACK_LIBRARIES=${GITHUB_WORKSPACE}/dependencies/lib/liblapack.a \
            -DHIGHS="${GITHUB_WORKSPACE}/dependencies/lib/libhighs.a;${GITHUB_WORKSPACE}/dependencies/lib/libhighs_extras.a" \
            -DBUILD_STATIC_LIBS=ON \
            -DBUILD_SHARED_LIBS=OFF

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build
        run: cmake --build build --target run_unotest --config ${{env.BUILD_TYPE}} --parallel

      # =========================================================
      # TEST
      # =========================================================

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C ${{env.BUILD_TYPE}}
