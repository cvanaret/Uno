name: Test unopy via GEMSEO interface

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '*.cff'
      - '*.yml'
      - '*.yaml'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '*.cff'
      - '*.yml'
      - '*.yaml'
      - 'docs/**'

env:
  BUILD_TYPE: Debug

jobs:
  build:
    name: GEMSEO ${{ matrix.gemseo.name }}
    runs-on: ${{ matrix.os }}
    # The job builds unopy from source: a hang must not block CI for 6 hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        architecture: [x64]
        python-version: ["3.12"]
        gemseo:
          # The latest stable release.
          - name: stable
            requirement: gemseo
          # The pre-releases of GEMSEO 7 (Python >= 3.11);
          # a specifier naming a pre-release lets pip select pre-releases.
          - name: 7 pre-release
            requirement: gemseo>=7.0.0rc0

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        # This is the version of the action for setting up Python, not the Python version.
        uses: actions/setup-python@v5
        with:
          # Semantic version range syntax or exact version of a Python version
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          
      - name: Install pybind11
        run: sudo apt install -y python3-pybind11 pybind11-dev

      - name: Install pytest, pytest-timeout, gemseo, and scipy
        run: pip install pytest pytest-timeout "${{ matrix.gemseo.requirement }}" scipy

      - name: Download dependencies
        run: bash dependencies/scripts/download_dependencies.sh

      - name: Compile and install unopy
        run: CMAKE_BUILD_PARALLEL_LEVEL=$(nproc) pip install . -v

      - name: Run tests
        run: python -m pytest -s --timeout=300 --import-mode=importlib ${{github.workspace}}/interfaces/Python/tests/test_gemseo.py
