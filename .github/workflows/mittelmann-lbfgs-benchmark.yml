name: Mittelmann L-BFGS benchmark

# Runs uno_ampl with the ipopt preset, a given linear solver (default MA57) and
# an L-BFGS Hessian on all the
# Mittelmann instances (time_limit=600s per instance), via the reusable
# Mittelmann benchmark workflow. Unlike mittelmann-lbfgs-benchmark.yml (NARX_CFy
# and WM_CFy only), results are stored in the artifact
# `mittelmann-lbfgs-full-[<linear_solver>-]results-pr-<pr_number>` (the solver
# only when it is not MA57) and posted in their own sticky PR comment; with
# `compare_pr`, as a before/after table against the latest results of this
# workflow on that PR obtained with `compare_linear_solver` (default: the same).
#   gh workflow run "Mittelmann L-BFGS benchmark" -f pr_number=123 [-f linear_solver=HIPO]
#     [-f compare_pr=118] [-f compare_linear_solver=MA57]

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment on'
        required: true
        type: string
      compare_pr:
        description: 'PR number to compare against (optional; uses its latest full L-BFGS benchmark results with compare_linear_solver)'
        required: false
        default: ''
        type: string
      linear_solver:
        description: 'Linear solver'
        required: false
        default: 'MA57'
        type: choice
        options: [MA57, MA27, MA86, MUMPS, SSIDS, HIPO]
      compare_linear_solver:
        description: 'Linear solver of the compare_pr results'
        required: false
        default: 'same'
        type: choice
        options: [same, MA57, MA27, MA86, MUMPS, SSIDS, HIPO]

# a called workflow cannot be granted more than its caller
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  benchmark:
    uses: ./.github/workflows/mittelmann-benchmark.yml
    with:
      pr_number: ${{ inputs.pr_number }}
      compare_pr: ${{ inputs.compare_pr }}
      # must not start with the title of another Mittelmann report: the comment
      # fallback of benchmark_compare.py finds the reports by their title
      title: Full Mittelmann L-BFGS benchmark
      tag: lbfgs-full
      options: preset=ipopt hessian_model=LBFGS
      linear_solver: ${{ inputs.linear_solver }}
      compare_linear_solver: ${{ inputs.compare_linear_solver }}
      time_limit: 600
