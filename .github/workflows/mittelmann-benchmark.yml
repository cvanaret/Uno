name: Mittelmann benchmark

# Compiles uno_ampl on the fly (ASL + libhsl) and runs it on the Mittelmann
# .nl instances, giving each one a given `time_limit`. Prints a per-instance
# summary (tickmark = solved, cross = failed) and the number of solved instances.
#
# Success/failure is read from each run's log: the optimization summary starts
# with the line   Optimization status:            Success
#
# Besides the wall time of each run, the log provides
#  - the solve time: "Solve time" in the optimization summary (wall clock of the solve);
#  - the model read time: "Model read time" (reading the .nl file), printed by
#    uno_ampl after the summary. Older versions of uno_ampl do not print it: it is
#    then the wall time minus the solve time.
# Both are unknown when the run has no optimization summary (crash, timeout).
#
# The linear solver is given by `linear_solver` (default MA57). MA27/MA57/MA86
# come from libhsl; MUMPS, SSIDS (SPRAL) and HIPO (HiGHS) are linked from the
# downloaded dependencies only when requested, so the default build is unchanged.
#
# Each run uploads its results (results.tsv + meta.json) as the artifact
# `mittelmann-[<tag>-][<linear_solver>-]results-pr-<pr_number>` (the solver only
# when it is not MA57). If `compare_pr` is given, the PR comment is a before/after
# table against the latest results of that PR with the same tag, obtained with
# `compare_linear_solver` (default: the same linear solver), from its artifact
# or, for older MA57 runs, from its benchmark comment. E.g. HIPO against MA57 on
# the same PR: -f pr_number=123 -f linear_solver=HIPO -f compare_pr=123 -f compare_linear_solver=MA57
#
# The workflow is also reusable (workflow_call) to benchmark a configuration on a
# subset of the instances, e.g. mittelmann-lbfgs-benchmark.yml. Such a run has its
# own `tag` and `title`, hence its own artifacts and sticky PR comment.

on:
  # Manual trigger: re-run the benchmark at any time from the Actions tab
  # ("Run workflow") or with `gh workflow run "Mittelmann benchmark"`
  # Post a "sticky" comment in the concerned PR (PR number is passed to
  # marocchino/sticky-pull-request-comment)
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment on'
        required: true
        type: string
      compare_pr:
        description: 'PR number to compare against (optional; uses its latest benchmark results with compare_linear_solver)'
        required: false
        default: ''
        type: string
      linear_solver:
        description: 'Linear solver'
        required: false
        default: 'MA57'
        type: choice
        options: [MA57, MA27, MA86, MUMPS, SSIDS, HIPO]
      compare_linear_solver:
        description: 'Linear solver of the compare_pr results'
        required: false
        default: 'same'
        type: choice
        options: [same, MA57, MA27, MA86, MUMPS, SSIDS, HIPO]
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      compare_pr:
        required: false
        default: ''
        type: string
      title:
        description: 'Title of the report (also identifies the report in the PR comments)'
        required: false
        default: 'Mittelmann benchmark'
        type: string
      tag:
        description: 'Identifies the configuration in the artifact names and the sticky PR comment'
        required: false
        default: ''
        type: string
      instances:
        description: 'Space-separated instance names (default: all the instances)'
        required: false
        default: ''
        type: string
      options:
        description: 'Space-separated name=value Uno options, on top of uno_mittelmann.opt (linear_solver excluded)'
        required: false
        default: ''
        type: string
      linear_solver:
        description: 'Linear solver: MA57, MA27, MA86, MUMPS, SSIDS or HIPO'
        required: false
        default: 'MA57'
        type: string
      compare_linear_solver:
        description: 'Linear solver of the compare_pr results (default: same as linear_solver)'
        required: false
        default: ''
        type: string
      time_limit:
        description: 'Time limit per instance (in seconds)'
        required: false
        default: 1200
        type: number

permissions:
  contents: read
  pull-requests: write
  actions: read  # to download the results artifact of the PR we compare against

env:
  BUILD_TYPE: Release
  VENV: /home/optimi/cvanaret/myenv
  HOME: /home/optimi/cvanaret
  SCRATCH: /scratch/local/opt-008547/cvanaret
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1
  # configuration of the run (defaults: full benchmark, triggered via workflow_dispatch).
  # TITLE, ARTIFACT_PREFIX, COMMENT_HEADER and LOGS_ARTIFACT are derived from
  # BASE_TITLE, TAG and LINEAR_SOLVER in the "Configure the run" step.
  BASE_TITLE: ${{ inputs.title || 'Mittelmann benchmark' }}
  TAG: ${{ inputs.tag }}
  LINEAR_SOLVER: ${{ inputs.linear_solver || 'MA57' }}
  COMPARE_LINEAR_SOLVER: ${{ inputs.compare_linear_solver }}
  INSTANCES: ${{ inputs.instances }}
  UNO_OPTIONS: ${{ inputs.options }}
  TIME_LIMIT: ${{ inputs.time_limit || 1200 }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: self-hosted
    # the default (360 minutes) is too short when many instances reach the time
    # limit. The PR comment needs the job token, which expires after 24 hours
    timeout-minutes: 1380
    steps:
      # Benchmark the head of PR `pr_number`, whichever branch the workflow is run
      # from: refs/pull/<N>/head also exists for PRs from forks, whose branches
      # cannot be selected in the "Run workflow" menu.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - name: Record the benchmarked commit
        run: echo "BENCHMARK_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Non-default linear solvers get their own title, artifacts and sticky
      # comment, so that comparisons are made against the same linear solver.
      - name: Configure the run
        run: |
          set -euo pipefail
          SOLVERS="MA57 MA27 MA86 MUMPS SSIDS HIPO"
          [ -n "$COMPARE_LINEAR_SOLVER" ] && [ "$COMPARE_LINEAR_SOLVER" != same ] || COMPARE_LINEAR_SOLVER=$LINEAR_SOLVER
          for solver in "$LINEAR_SOLVER" "$COMPARE_LINEAR_SOLVER"; do
            [[ " $SOLVERS " == *" $solver "* ]] \
              || { echo "::error::linear solvers must be among ${SOLVERS}, got '$solver'"; exit 1; }
          done
          for option in $UNO_OPTIONS; do
            if [[ "$option" == linear_solver=* ]]; then
              echo "::error::pass the linear solver with the linear_solver input, not in options"; exit 1
            fi
          done
          # <tag>[-<solver>] and <title>[ (<solver>)], the solver only when it is not MA57
          config_of() { local config=$TAG; [ "$1" = MA57 ] || config=${config:+${config}-}$1; echo "${config:+${config}-}"; }
          title_of() { if [ "$1" = MA57 ]; then echo "$BASE_TITLE"; else echo "$BASE_TITLE ($1)"; fi; }
          if [ "$COMPARE_LINEAR_SOLVER" = "$LINEAR_SOLVER" ]; then
            comparison_title=$(title_of "$LINEAR_SOLVER")
          else
            comparison_title="${BASE_TITLE} (${COMPARE_LINEAR_SOLVER} → ${LINEAR_SOLVER})"
          fi
          {
            echo "TITLE=$(title_of "$LINEAR_SOLVER")"
            echo "ARTIFACT_PREFIX=mittelmann-$(config_of "$LINEAR_SOLVER")results-pr-"
            echo "COMMENT_HEADER=mittelmann-$(config_of "$LINEAR_SOLVER")benchmark"
            echo "LOGS_ARTIFACT=mittelmann-$(config_of "$LINEAR_SOLVER")logs"
            # results of compare_pr
            echo "COMPARE_LINEAR_SOLVER=${COMPARE_LINEAR_SOLVER}"
            echo "COMPARE_TITLE=$(title_of "$COMPARE_LINEAR_SOLVER")"
            echo "COMPARE_ARTIFACT_PREFIX=mittelmann-$(config_of "$COMPARE_LINEAR_SOLVER")results-pr-"
            echo "COMPARISON_TITLE=${comparison_title}"
          } | tee -a "$GITHUB_ENV"
          # SSIDS (SPRAL) refuses to run without OpenMP cancellation
          if [ "$LINEAR_SOLVER" = SSIDS ]; then
            echo "OMP_CANCELLATION=TRUE" >> "$GITHUB_ENV"
          fi

      - name: Download Uno solver dependencies
        run: bash dependencies/scripts/download_dependencies.sh

      - name: Install Meson, Ninja, and patchelf
        run: |
          ${{env.VENV}}/bin/pip install meson==1.7.1
          ${{env.VENV}}/bin/pip install ninja
          ${{env.VENV}}/bin/pip install patchelf
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Uno (ASL + libhsl [+ MUMPS, SPRAL or HiGHS])
        run: |
          set -euo pipefail
          LIBBLAS_PATH="/usr/lib/x86_64-linux-gnu/libblas.so"
          LIBLAPACK_PATH="/usr/lib/x86_64-linux-gnu/liblapack.so"
          LIBHSL_PATH="$HOME/libhsl/builddir/libhsl.so"
          LIBAMPL_PATH="$HOME/ampl/amplsolver.a"
          DEPS="${{ github.workspace }}/dependencies"

          # MUMPS, SPRAL and HiGHS (static, from UnoUtils) are only linked when requested
          case "$LINEAR_SOLVER" in
            MUMPS)
              SOLVER_FLAGS=("-DMUMPS_INCLUDE_DIR=${DEPS}/include" "-DMETIS_INCLUDE_DIR=${DEPS}/include"
                            "-DMUMPS_LIBRARY=${DEPS}/lib/libdmumps.a" "-DMUMPS_COMMON_LIBRARY=${DEPS}/lib/libmumps_common.a"
                            "-DMUMPS_PORD_LIBRARY=${DEPS}/lib/libpord.a" "-DMUMPS_MPISEQ_LIBRARY=${DEPS}/lib/libmpiseq.a"
                            "-DMETIS_LIBRARY=${DEPS}/lib/libmetis.a")
              FOUND="Found MUMPS" ;;
            SSIDS)
              SOLVER_FLAGS=("-DSPRAL_INCLUDE_DIR=${DEPS}/include" "-DSPRAL=${DEPS}/lib/libspral.a" "-DMETIS=${DEPS}/lib/libmetis.a")
              FOUND="Found SPRAL" ;;
            HIPO)
              SOLVER_FLAGS=("-DHIGHS_INCLUDE_DIR=${DEPS}/include/highs"
                            "-DHIGHS=${DEPS}/lib/libhighs.a;${DEPS}/lib/libhighs_extras.a" -DHIGHS_WITH_HIPO=ON)
              FOUND="HiPO linear solver enabled" ;;
            *)
              SOLVER_FLAGS=()
              FOUND="Found hsl" ;;
          esac

          cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                                             -DBLAS_LIBRARIES=${LIBBLAS_PATH} \
                                             -DLAPACK_LIBRARIES=${LIBLAPACK_PATH} \
                                             -DHSL=${LIBHSL_PATH} \
                                             -DAMPLSOLVER=${LIBAMPL_PATH} \
                                             -DBQPD=${DEPS}/lib/libbqpd.a \
                                             "${SOLVER_FLAGS[@]}" \
                                             -DBUILD_SHARED_LIBS=ON \
                                             -DBUILD_STATIC_LIBS=OFF | tee cmake-configure.log
          # fail now rather than after hours of runs that all fail
          grep -q -- "-- ${FOUND}" cmake-configure.log \
            || { echo "::error::linear_solver=${LINEAR_SOLVER}: '${FOUND}' missing from the CMake output"; exit 1; }

      # uno_ampl is EXCLUDE_FROM_ALL, so it must be requested explicitly.
      - name: Build uno_ampl
        run: cmake --build ${{ github.workspace }}/build --target uno_ampl --config ${{ env.BUILD_TYPE }} --parallel

      - name: Run Mittelmann instances and summarize
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -uo pipefail
          UNO="${{ github.workspace }}/build/uno_ampl"
          DIR="${{ env.SCRATCH }}/Mittelmann"
          TIMELIMIT="$TIME_LIMIT"
          OPTION_FILE="uno_mittelmann.opt"
          read -ra EXTRA_OPTIONS <<< "$UNO_OPTIONS"

          if [ -z "$INSTANCES" ]; then
            mapfile -t NL_FILES < <(find "$DIR" -type f -name '*.nl' | sort)
          else
            NL_FILES=()
            for name in $INSTANCES; do
              file="$(find "$DIR" -type f -name "${name}.nl" | head -n 1)"
              if [ -z "$file" ]; then
                echo "::error::Instance '${name}' not found under '$DIR'"; exit 1
              fi
              NL_FILES+=("$file")
            done
          fi
          if [ "${#NL_FILES[@]}" -eq 0 ]; then
            echo "::error::No .nl files found under '$DIR'"; exit 1
          fi

          mkdir -p logs results
          : > results/results.tsv
          solved=0
          total=${#NL_FILES[@]}
          declare -a CONSOLE
          rows=""

          fmt_time() { if [ -n "$1" ]; then echo "${1}s"; else echo "—"; fi; }

          for nl in "${NL_FILES[@]}"; do
            name="$(basename "$nl" .nl)"
            log="logs/${name}.log"

            start=$(date +%s.%N)
            # Uno enforces time_limit=$TIMELIMIT itself; the outer `timeout` is only a
            # safety net in case a run gets stuck past its own limit.
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Solving ${name}"
            timeout $((TIMELIMIT + 30)) "$UNO" "$nl" option_file="$OPTION_FILE" time_limit="$TIMELIMIT" \
              linear_solver="$LINEAR_SOLVER" "${EXTRA_OPTIONS[@]}" > "$log" 2>&1 || true
            end=$(date +%s.%N)
            # an unusable linear solver makes every run fail: stop at the first one
            if grep -Eq 'The linear solver [A-Za-z0-9]+ (was requested, but|is unknown)|HiPO is not available' "$log"; then
              cat "$log"
              echo "::error::linear_solver=${LINEAR_SOLVER} is not usable by this build"; exit 1
            fi
            secs=$(awk "BEGIN{printf \"%.2f\", ${end} - ${start}}")

            # "Solve time:   <seconds>s" (optimization summary) and "Model read time:   <seconds>s" (uno_ampl)
            solve_time=$(sed -nE 's/^Solve time:[[:space:]]+([0-9.eE+-]+)s[[:space:]]*$/\1/p' "$log" | tail -n 1)
            read_time=$(sed -nE 's/^Model read time:[[:space:]]+([0-9.eE+-]+)s[[:space:]]*$/\1/p' "$log" | tail -n 1)
            if [ -n "$solve_time" ]; then
              if [ -z "$read_time" ]; then
                # older uno_ampl: the rest of the run
                read_time=$(awk -v t="${end}" -v s="${start}" -v u="${solve_time}" 'BEGIN{r = t - s - u; if (r < 0) r = 0; print r}')
              fi
              read_time=$(awk -v r="${read_time}" 'BEGIN{printf "%.2f", r}')
              solve_time=$(awk -v u="${solve_time}" 'BEGIN{printf "%.2f", u}')
            else
              read_time=""
            fi
            breakdown="model read $(fmt_time "$read_time"), solve $(fmt_time "$solve_time")"

            if grep -Eq '^Optimization status:[[:space:]]+Success' "$log"; then
              solved=$((solved + 1))
              result=solved; icon=✅; console_icon=✓; verb="was solved"
            else
              result=failed; icon=❌; console_icon=✗; verb="failed"
            fi
            CONSOLE+=("${console_icon} instance ${name} ${verb} in ${secs} seconds (${breakdown})")
            rows+="| ${icon} | \`${name}\` | ${result} in ${secs}s | $(fmt_time "$read_time") | $(fmt_time "$solve_time") |"$'\n'
            # <name> <solved|failed> <wall time> <model read time> <solve time> (the last two may be empty)
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$result" "$secs" "$read_time" "$solve_time" >> results/results.tsv
            echo "${result} in ${secs}s (${breakdown})"
          done

          # ---- machine-readable metadata, used by later comparisons ----
          cat > results/meta.json <<EOF
          {"sha": "${BENCHMARK_SHA}", "pr": "${PR_NUMBER}", "time_limit": ${TIMELIMIT}, "options": "${UNO_OPTIONS}",
           "linear_solver": "${LINEAR_SOLVER}",
           "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"}
          EOF

          # ---- console summary (what you asked for) ----
          echo ""
          echo "================= SUMMARY ================="
          for line in "${CONSOLE[@]}"; do echo "$line"; done
          echo "------------------------------------------"
          echo "Solved ${solved} / ${total} instances"
          echo "=========================================="

          # ---- build the markdown report (shared by the run page and the PR comment) ----
          {
            echo "## ${TITLE} — uno_ampl (time_limit=${TIMELIMIT}s)"
            echo ""
            echo "Commit \`${BENCHMARK_SHA:0:7}\` · linear solver \`${LINEAR_SOLVER}\` · [run details](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            if [ -n "$UNO_OPTIONS" ]; then
              echo ""
              echo "Options: \`${UNO_OPTIONS}\`"
            fi
            echo ""
            echo "| | instance | result | model read | solve |"
            echo "|:-:|:--|:--|--:|--:|"
            printf '%s' "$rows"
            echo ""
            echo "<sub>result: wall time of the run · model read and solve: from uno_ampl's log</sub>"
            echo ""
            echo "**Solved ${solved} / ${total} instances**"
          } > benchmark-comment.md

          # ---- pretty summary on the workflow run page ----
          cat benchmark-comment.md >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=${TITLE}::Solved ${solved}/${total} instances"

      # Replaces the plain report with a before/after table against the latest
      # results of `compare_pr`. If those cannot be found, a warning is emitted
      # and the plain report is posted unchanged.
      - name: Compare against another PR
        if: inputs.compare_pr != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPARE_PR: ${{ inputs.compare_pr }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$COMPARE_PR" =~ ^[0-9]+$ ]]; then
            echo "::error::compare_pr must be a PR number, got '$COMPARE_PR'"; exit 1
          fi
          # the comment fallback only covers runs that predate the artifacts, all with MA57
          FALLBACK=()
          [ "$COMPARE_LINEAR_SOLVER" != MA57 ] || FALLBACK=(--comment-fallback --compare-title "$COMPARE_TITLE")
          ${{ env.VENV }}/bin/python .github/scripts/benchmark_compare.py \
            --title "$COMPARISON_TITLE" --artifact-prefix "$COMPARE_ARTIFACT_PREFIX" "${FALLBACK[@]}" \
            --compare-pr "$COMPARE_PR" --current-pr "$PR_NUMBER" \
            --results-dir results --output benchmark-comment.md
          if grep -q 'before/after' benchmark-comment.md; then
            { echo ""; cat benchmark-comment.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Results of this run, so that future runs can compare against this PR.
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}${{ inputs.pr_number }}
          path: results/
          retention-days: 90

      # Posts the benchmark report as a comment on the PR. The `header` makes it a
      # "sticky" comment: subsequent runs on the same PR (i.e. new commits) update
      # this same comment in place instead of adding a new one.
      - name: Post benchmark results as a PR comment
        if: github.event_name == 'workflow_dispatch'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          append: true
          header: ${{ env.COMMENT_HEADER }}
          number: ${{ inputs.pr_number }}
          path: benchmark-comment.md

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LOGS_ARTIFACT }}
          path: logs/
